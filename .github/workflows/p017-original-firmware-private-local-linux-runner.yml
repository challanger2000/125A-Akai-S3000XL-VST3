name: P017 - ROM-free native Linux MAME S3000XL for owner-private firmware QA
on:
  workflow_dispatch:
  push:
    branches: ['feature/p017-**']
    paths:
      - '.github/workflows/p017-original-firmware-private-local-linux-runner.yml'
permissions:
  contents: read
jobs:
  linux-local-private-evidence-host:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout 125A patch source WITHOUT any owner ROM
        uses: actions/checkout@v4
      - name: Install native MAME 0.288 headless dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential git python3 libfontconfig-dev libfreetype6-dev \
            libsdl2-dev libsdl2-ttf-dev libasound2-dev libpulse-dev \
            libflac-dev libjpeg-dev libsqlite3-dev liblua5.4-dev \
            libx11-dev libxi-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libudev-dev libportmidi-dev libjack-jackd2-dev \
            qt6-base-dev qt6-base-dev-tools
      - name: Clone exact upstream MAME 0.288 and apply same original-hardware patch
        shell: bash
        run: |
          set -euxo pipefail
          git clone --filter=blob:none --depth 1 --branch mame0288 https://github.com/mamedev/mame.git external/mame
          git -C external/mame apply --check "$GITHUB_WORKSPACE/mame-0288-s3000xl-vst.patch"
          git -C external/mame apply "$GITHUB_WORKSPACE/mame-0288-s3000xl-vst.patch"
      - name: Build only native patched S3000XL machine and its hardware dependencies
        shell: bash
        run: |
          set -euxo pipefail
          make -C external/mame -j3 \
             SUBTARGET=s3000xl SOURCES=src/mame/akai/s3000.cpp \
             OSD=sdl USE_QTDEBUG=0 NOWERROR=1 ARCHOPTS_CXX=-std=c++20 \
             CXXFLAGS='-std=c++20'
          ls -lh external/mame/s3000xl
      - name: Verify original firmware owner can boot this binary without cloud ROM sharing
        shell: bash
        run: |
          set -euxo pipefail
          test -x external/mame/s3000xl
          external/mame/s3000xl -help > /tmp/mame-help.txt
          grep -qi mame /tmp/mame-help.txt
          mkdir -p owner-local-probe
          cp external/mame/s3000xl owner-local-probe/s3000xl
          sha256sum owner-local-probe/s3000xl > owner-local-probe/sha256.txt
          printf 'ROM-FREE original patched MAME 0.288 Linux executable.\nNO private firmware in CI.\nRun locally with owner-supplied ROM zip only.\n' > owner-local-probe/README.txt
          file owner-local-probe/s3000xl
      - name: Downloadable ROM-free host binary to make PRIVATE local V2.0 boot test possible
        uses: actions/upload-artifact@v4
        with:
          name: 125A-P017-Linux-Patched-Original-MAME-ROM-FREE
          path: owner-local-probe/**
          retention-days: 7
          if-no-files-found: error
