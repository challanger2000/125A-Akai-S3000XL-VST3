name: 125A Akai - full Windows VST3 ROM-free build
on:
  workflow_dispatch:
  # P059: the full native Windows job must also be visible as a PR check.
  pull_request:
    branches: [ 'feature/p017-**' ]
    paths:
      - 'CMakeLists.txt'
      - 'Source/**'
      - 'mame-0288-s3000xl-vst.patch'
      - 'scripts/build/**'
      - '.github/workflows/windows-full-vst3.yml'
  push:
    branches: [ 'develop/**', 'feature/p017-**' ]
    paths:
      - 'CMakeLists.txt'
      - 'Source/**'
      - 'mame-0288-s3000xl-vst.patch'
      - 'scripts/build/**'
      - '.github/workflows/windows-full-vst3.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: akai-vst3-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-vst3:
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: P059 in-place MAME engine restart and original native error capture
        shell: pwsh
        run: |
          python qa/test_p059_engine_restart.py
          if ($LASTEXITCODE -ne 0) { throw "MAME startup error recovery contract invalid" }
      - name: P058 incomplete DAW original-machine state rejection
        shell: pwsh
        run: |
          python qa/test_p058_incomplete_host_state.py
          if ($LASTEXITCODE -ne 0) { throw "Incomplete Akai original state reopened silently" }
      - name: P057 original machine state signature gate and mutants
        shell: pwsh
        run: |
          python qa/test_p057_native_state_header.py
          if ($LASTEXITCODE -ne 0) { throw "P057 MAME save compatibility guard invalid" }
      - name: P062 original firmware CD5 one-click ISO cold-boot contract
        shell: pwsh
        run: |
          python qa/test_p062_firmware_cd5_coldboot.py
          if ($LASTEXITCODE -ne 0) { throw "S3000XL CD4 original cold boot media regression" }
      - name: P065 diagnostic rateprobe CPU bypass and original sampler isolation
        shell: pwsh
        run: |
          python qa/test_p065_rateprobe_no_cpu_reads.py
          if ($LASTEXITCODE -ne 0) { throw 'P065 original sampler rateprobe optimization regressed' }
      - name: Install MAME 0.288 build prerequisites
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            git make python
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-python
      - name: Checkout pinned MAME + JUCE, verify and apply patch
        shell: pwsh
        run: |
          git clone --filter=blob:none --depth 1 --branch mame0288 https://github.com/mamedev/mame.git external/mame
          if ($LASTEXITCODE -ne 0) { throw "MAME clone failed" }
          git clone --filter=blob:none --depth 1 --branch 8.0.12 https://github.com/juce-framework/JUCE.git external/JUCE
          if ($LASTEXITCODE -ne 0) { throw "JUCE clone failed" }
          git -C external/mame apply --check "$env:GITHUB_WORKSPACE/mame-0288-s3000xl-vst.patch"
          if ($LASTEXITCODE -ne 0) { throw "MAME patch is not applicable" }
          git -C external/mame apply "$env:GITHUB_WORKSPACE/mame-0288-s3000xl-vst.patch"
          if ($LASTEXITCODE -ne 0) { throw "MAME patch application failed" }
      - name: P052 CD before original MAME project recall regression
        shell: pwsh
        run: |
          python qa/test_p052_cd_restore_order.py
          if ($LASTEXITCODE -ne 0) { throw "CD-image state restore order invalid" }
      - name: P050 native Akai SCSI mapping regression
        shell: msys2 {0}
        run: |
          /mingw64/bin/g++ -std=c++17 -Wall -Wextra -Werror -I. tests/P050ScsiMediaPlan.cpp -o p050-scsi-plan-test.exe
          ./p050-scsi-plan-test.exe
      - name: Patch JUCE VST3 callback lock to nonblocking try-lock
        shell: pwsh
        run: |
          python scripts/build/test_patch_juce_vst3_realtime.py
          if ($LASTEXITCODE -ne 0) { throw "JUCE realtime patch negative-control tests failed" }
          python scripts/build/patch_juce_vst3_realtime.py --juce-root external/JUCE
          if ($LASTEXITCODE -ne 0) { throw "Cannot prove realtime-safe JUCE VST3 callback lock" }
      - name: Create verified open-source layout resources
        shell: pwsh
        run: |
          python scripts/build/generate_open_resources.py --mame-root external/mame --out build/resource-proof
          if ($LASTEXITCODE -ne 0) { throw "Failed to generate MAME layout resources" }
      - name: Syntax-check the offline ROM packer without exposing any ROMs
        shell: pwsh
        run: |
          python -m py_compile scripts/build/pack_private_rom_overlay.py
          if ($LASTEXITCODE -ne 0) { throw "Private offline packer is invalid" }
      - name: Generate native VS2022 projects for MAME
        shell: msys2 {0}
        working-directory: external/mame
        run: |
          export OS=Windows_NT
          # GENie is a native Windows exe. Its absolute makedep.py path uses
          # D:/... drive notation; MSYS2 /usr/bin/python3 treats it as a
          # POSIX-relative path. Use the MinGW *native Windows* Python.
          test -f /mingw64/bin/python.exe
          /mingw64/bin/python.exe -c "import sys; assert sys.platform == 'win32'"
          make vs2022 SUBTARGET=s3000xl SOURCES=src/mame/akai/s3000.cpp NOWERROR=1 PYTHON_EXECUTABLE=python.exe -j2
      - name: Compile full MAME static libraries
        shell: pwsh
        run: |
          $vswhere = 'C:/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.Component.MSBuild -property installationPath
          if (-not $vs) { throw "Visual Studio 2022 not installed" }
          $msbuild = Join-Path $vs 'MSBuild/Current/Bin/MSBuild.exe'
          $solution = 'external/mame/build/projects/windows/mames3000xl/vs2022/mames3000xl.sln'
          if (-not (Test-Path $solution)) { throw "MAME VS2022 solution not generated: $solution" }
          $env:_CL_='/U_WIN32_WINNT /UNTDDI_VERSION /D_WIN32_WINNT=0x0A00 /DNTDDI_VERSION=0x0A000000'
          & $msbuild $solution '/p:Configuration=Release' '/p:Platform=x64' '/p:PreferredToolArchitecture=x64' '/m:2' '/v:minimal' '/nologo'
          $code=$LASTEXITCODE
          Remove-Item Env:_CL_ -ErrorAction SilentlyContinue
          if ($code -ne 0) { throw "MAME static library compilation failed: $code" }
      - name: Configure original-MAME/JUCE Windows VST3
        shell: pwsh
        run: |
          cmake -S . -B build/windows -G 'Visual Studio 17 2022' -A x64 -DAKAI_MAME_ROOT="$env:GITHUB_WORKSPACE/external/mame" -DAKAI_JUCE_ROOT="$env:GITHUB_WORKSPACE/external/JUCE"
          if ($LASTEXITCODE -ne 0) { throw "VST3 CMake configure failed" }
      - name: Compile full Windows VST3 (ROM-free public test)
        shell: pwsh
        run: |
          cmake --build build/windows --config Release --target AkaiS3000XL_VST3 --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "Actual Windows VST3 compile/link failed" }
      - name: Validate and canonicalize VST3 moduleinfo as strict JSON
        shell: pwsh
        run: |
          python scripts/build/validate_moduleinfo.py --root build/windows
          if ($LASTEXITCODE -ne 0) { throw "VST3 moduleinfo JSON invalid" }
      - name: Confirm build output exists
        shell: pwsh
        run: |
          $bundle=Get-ChildItem 'build/windows' -Directory -Recurse -Filter '*.vst3' | Select-Object -First 1
          if (-not $bundle) { throw 'VST3 bundle not created' }
          $vst3=Get-ChildItem $bundle.FullName -Recurse -File -Filter '*.vst3' | Select-Object -First 1
          if (-not $vst3) { throw 'No VST3 module binary inside bundle' }
          Write-Output "WINDOWS_VST3_LINK=PASS ROM_BYTES_IN_CI=NONE BUNDLE=$($bundle.FullName)"
      - name: Upload public ROM-free diagnostic build only
        uses: actions/upload-artifact@v4
        with:
          name: 125A-Akai-S3000XL-ROM-FREE-Windows-VST3-build-check
          path: build/windows/**/VST3/**
          if-no-files-found: error
          retention-days: 7
      - name: Download pinned production 125A Plugin Tester v0.3.2
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh run download 39823684764 --repo challanger2000/125A-Plugin-Tester-Final --name 125A-Plugin-Tester-v0.3.2-Windows-x64 --dir tester
          if ($LASTEXITCODE -ne 0) {throw "Could not download pinned 125A Tester"}
      - name: Run complete Windows VST3 and Steinberg host QA
        id: qa
        continue-on-error: true
        shell: pwsh
        run: ./scripts/build/run_windows_qa.ps1
      - name: Preserve actual 125A QA reports on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 125A-Akai-S3000XL-Windows-REAL-Host-QA
          path: build/windows-qa-reports/**
          if-no-files-found: warn
          retention-days: 7
      - name: Require production tester and official Steinberg validator PASS
        if: always()
        shell: pwsh
        env:
          QA_OUTCOME: ${{ steps.qa.outcome }}
        run: |
          if ($env:QA_OUTCOME -ne 'success') {throw "REAL VST3 QA IS NOT PASS. See Windows host diagnostics. Never release."}
