name: 125A Akai - isolated Windows C++ contracts
on:
  push:
    branches: [ 'develop/**', 'feature/p017-**' ]
    paths:
      - '.github/workflows/core-contracts.yml'
      - 'Source/AkaiAnalogControls.h'
      - 'Source/AkaiFirmwareMonitor.h'
      - 'Source/AkaiWavInput.h'
      - 'Source/AkaiWavCaptureState.h'
      - 'Source/AkaiCaptureAutomation.h'
      - 'Source/AkaiInstanceAudioState.h'
      - 'Source/AkaiMachineState.h'
      - 'Source/AkaiPanelOverlayLayout.h'
      - 'Source/PluginEditor.cpp'
      - 'tests/**'
      - 'qa/private_original_rom_sds_source_recall.py'
      - 'qa/test_original_rack_overlay_wiring.py'
      - 'qa/test_no_external_wav_import.py'
  pull_request:
    paths:
      - '.github/workflows/core-contracts.yml'
      - 'Source/AkaiAnalogControls.h'
      - 'Source/AkaiFirmwareMonitor.h'
      - 'Source/AkaiWavInput.h'
      - 'Source/AkaiWavCaptureState.h'
      - 'Source/AkaiCaptureAutomation.h'
      - 'Source/AkaiInstanceAudioState.h'
      - 'Source/AkaiMachineState.h'
      - 'Source/AkaiPanelOverlayLayout.h'
      - 'Source/PluginEditor.cpp'
      - 'tests/**'
      - 'qa/private_original_rom_sds_source_recall.py'
      - 'qa/test_original_rack_overlay_wiring.py'
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S tests -B build-core -DCMAKE_BUILD_TYPE=Release
      - name: Compile
        run: cmake --build build-core --config Release --parallel 2
      - name: Run native tests
        run: ctest --test-dir build-core -C Release --output-on-failure

      - name: P045 original-ROM runner syntax and CLI (ROM-free only)
        run: |
          python -m py_compile qa/private_original_rom_sds_source_recall.py
          python qa/private_original_rom_sds_source_recall.py --help

      - name: P046 removed WAV import contract + deliberate mutants
        run: python qa/test_no_external_wav_import.py

      - name: P048 original rack ear panel placement + mutation controls
        run: python qa/test_original_rack_overlay_wiring.py
