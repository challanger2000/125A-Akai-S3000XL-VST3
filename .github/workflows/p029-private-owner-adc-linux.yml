name: P029 - private owner original ADC WAV probe, ROM-free Linux runner
on:
  workflow_dispatch:
  push:
    branches: [ 'feature/p027-**' ]
    paths:
      - '.github/workflows/p029-private-owner-adc-linux.yml'
      - 'qa/enable_private_adc_converter_fixture.py'
permissions:
  contents: read
jobs:
  private-adc-probe-linux-binary:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install original MAME native Linux build prerequisites
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential git python3 libfontconfig-dev libfreetype6-dev \
            libsdl2-dev libsdl2-ttf-dev libasound2-dev libpulse-dev \
            libflac-dev libjpeg-dev libsqlite3-dev liblua5.4-dev \
            libx11-dev libxi-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libudev-dev libportmidi-dev libjack-jackd2-dev qt6-base-dev qt6-base-dev-tools
      - name: Apply exact MAME 0.288 production hardware patch
        shell: bash
        run: |
          set -euxo pipefail
          git clone --filter=blob:none --depth 1 --branch mame0288 https://github.com/mamedev/mame.git external/mame
          git -C external/mame apply --check "$GITHUB_WORKSPACE/mame-0288-s3000xl-vst.patch"
          git -C external/mame apply "$GITHUB_WORKSPACE/mame-0288-s3000xl-vst.patch"
      - name: Apply OWNER TEST ONLY WAV to ADC conversion overlay
        shell: bash
        run: |
          set -euxo pipefail
          python3 qa/enable_private_adc_converter_fixture.py external/mame/src/mame/akai/s3000.cpp
          grep -n 'OWNER_ADC_PCM_LOADED' external/mame/src/mame/akai/s3000.cpp
      - name: Build separate diagnostic native original MAME Akai
        shell: bash
        run: |
          set -euxo pipefail
          make -C external/mame -j3 \
            SUBTARGET=s3000xl SOURCES=src/mame/akai/s3000.cpp \
            OSD=sdl USE_QTDEBUG=0 NO_X11=0 NOWERROR=1 ARCHOPTS_CXX=-std=c++20 \
            CXXFLAGS='-std=c++20'
          test -x external/mame/s3000xl
      - name: Package ONLY ROM-free diagnostic exe
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p owner-private-adc-runner
          cp external/mame/s3000xl owner-private-adc-runner/s3000xl
          sha256sum owner-private-adc-runner/s3000xl > owner-private-adc-runner/sha256.txt
          echo 'TEST ONLY. Native MAME original Akai engine, converter path loads PCM16 stereo 44100 WAV from env AKAI_OWNER_PRIVATE_ADC_WAV. No owner ROM; no Windows VST3. Never distribute as product.' > owner-private-adc-runner/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: P029-Akai-Linux-Original-ADC-WAV-fixture-ROM-FREE-NOT-VST3
          path: owner-private-adc-runner/**
          retention-days: 7
          if-no-files-found: error
